<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sincorá — Produto</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    .visual-ring {
      position: absolute;
      width: 70%; height: 70%;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.2);
      pointer-events: none;
    }
    .visual-ring.outer { width: 90%; height: 90%; border-color: rgba(255,255,255,0.1); }

    /* Foto ocupa todo o painel, centralizada e com object-fit */
    .product-img {
      position: relative;
      z-index: 1;
      width: 85%;
      height: 85%;
      object-fit: contain;
      border-radius: 12px;
      filter: drop-shadow(0 8px 32px rgba(0,0,0,0.3));
    }

    /* Foto no card (catálogo) */
    .card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0;
    }
    .card-emoji-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .not-found {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--clr-text-muted);
    }
    .not-found h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="../index.html" class="brand">
        <div class="brand-mark">S</div>
        <span class="brand-name">sincorá</span>
      </a>
      <span class="header-tagline">Sabor da Chapada Diamantina</span>
    </div>
  </header>

  <main class="product-page">
    <a href="../index.html" class="back-link">
      <span>←</span> Ver todos os produtos
    </a>
    <div id="product-content"></div>
  </main>

  <footer class="site-footer">
    <p>Obrigado por comprar!</p>
    <small>sincorá · Mucugê, Chapada Diamantina · BA</small>
  </footer>

  <script src="../script.js"></script>
  <script>
    const id      = parseInt(new URLSearchParams(window.location.search).get('id'), 10);
    const product = sincora.products.find(p => p.id === id);
    const content = document.getElementById('product-content');

    if (!product) {
      content.innerHTML = `
        <div class="not-found">
          <h2>Produto não encontrado</h2>
          <p><a href="../index.html">Voltar ao catálogo</a></p>
        </div>`;
    } else {
      document.title = `Sincorá — ${product.name}`;
      const isLicor = product.category === 'licor';

      const priceHTML = isLicor ? `
        <div style="flex:1">
          <span class="price-label">100 ml</span>
          <span class="price-value">R$&nbsp;33,82</span>
          <span class="price-label">375 ml</span>
          <span class="price-value">R$&nbsp;68,94</span>
          <span class="price-label">750 ml</span>
          <span class="price-value">R$&nbsp;113,15</span>
        </div>` : `
        <div style="flex:1">
          <span class="price-label">Preço</span>
          <span class="price-value">${product.price}</span>
        </div>
        <div class="volume-value">${product.volume}</div>`;

      const tagsHTML = product.tags.map(t => `<span class="tag">${t}</span>`).join('');

      content.innerHTML = `
        <div class="product-layout">
          ${sincora.getVisualHTML(product, 'page', true)}
          <div class="product-info">
            <span class="product-category-badge">— ${isLicor ? 'Licor Fino' : 'Suco de Fruta Integral'}</span>
            <h1 class="product-title">${product.name}</h1>
            ${product.subtitle ? `<p class="product-subtitle">${product.subtitle}</p>` : ''}
            <div class="product-price-box">${priceHTML}</div>
            <p class="product-description">${product.description}</p>
            <div class="product-tags">${tagsHTML}</div>
            <div class="origin-strip">
              <div class="origin-icon">🏔</div>
              <div class="origin-text">
                <strong>Origem: Mucugê — Chapada Diamantina, BA</strong>
                Produzido com frutas cultivadas com respeito à terra e à agricultura familiar.
              </div>
            </div>
          </div>
        </div>`;
    }
  </script>
</body>
</html>
