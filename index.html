<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sincorá — Catálogo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="shortcut icon" href="images/favicon.png" type="image/x-icon">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <div class="brand-mark">
          S
        </div>
        <span class="brand-name">Sincorá</span>
      </a>
      <a style="text-decoration: none;" href="tablet.html"><span class="header-tagline">Sabor da Chapada Diamantina</span></a>
    </div>
  </header>

  <section class="hero-strip">
    <h1>Sucos &amp; <em>Licores</em> Artesanais</h1>
    <p>Mucugê · Chapada Diamantina · Bahia</p>
  </section>

  <div class="filter-bar">
    <span class="filter-label">Filtrar:</span>
    <button class="filter-btn active" data-filter="all">Todos</button>
    <button class="filter-btn" data-filter="suco">Sucos</button>
    <button class="filter-btn" data-filter="licor">Licores</button>
  </div>

  <main class="catalog">
    <p class="section-label" id="sucos-label">Sucos — 300 ml</p>
    <div class="catalog-grid" id="catalog-grid"></div>

    <p class="section-label" id="licores-label">Licores Finos</p>
    <div class="catalog-grid" id="licores-grid"></div>
  </main>

  <footer class="site-footer">
    <small>(75) 9 9147-9993✆</small>
    <small>refugiodaserracontato@gmail.com</small>
    <small>Mucugê, Chapada Diamantina · BA</small>
  </footer>

  <script src="script.js"></script>
  <script>
    const juiceGrid    = document.getElementById('catalog-grid');
    const licorGrid    = document.getElementById('licores-grid');
    const sucosLabel   = document.getElementById('sucos-label');
    const licoresLabel = document.getElementById('licores-label');

    let juiceIndex = 0, licorIndex = 0;

    sincora.products.forEach(p => {
      const isLicor = p.category === 'licor';
      const idx     = isLicor ? licorIndex++ : juiceIndex++;

      const card = document.createElement('a');
      card.className = 'product-card';
      card.href = `pages/product.html?id=${p.id}`;
      card.dataset.category = p.category;
      card.style.animationDelay = `${idx * 0.06}s`;

      card.innerHTML = `
        ${sincora.getVisualHTML(p, 'card', false)}
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-volume">${isLicor ? (p.subtitle || 'Licor Fino') : 'Suco de Fruta Integral'}</div>
          <div class="card-footer">
            <span class="card-price">${isLicor ? 'R$ 33,82 <br> R$ 68,94 <br> R$ 113,15' : p.price}</span>
            <span class="card-cta">→</span>
          </div>
        </div>`;

      (isLicor ? licorGrid : juiceGrid).appendChild(card);
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        document.querySelectorAll('.product-card').forEach(card => {
          card.classList.toggle('hidden', filter !== 'all' && card.dataset.category !== filter);
        });
        sucosLabel.style.display   = filter === 'licor' ? 'none' : '';
        licoresLabel.style.display = filter === 'suco'  ? 'none' : '';
      });
    });
  </script>
</body>
</html>
